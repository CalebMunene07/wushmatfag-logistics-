<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track & Trace | Paramount Logistics</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/favicon.ico">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand">
      <span class="brand-logo-wrap">
        <img src="images/logo.jpeg" alt="" class="brand-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="brand-mark" style="display:none;"></span>
      </span>
      <span class="brand-name">WUSHMAT FAG LTD</span>
    </a>
    <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="nav-links" id="nav-links">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="index.html#services">Services</a>
      <a href="track.html" data-page="track.html">Track & Trace</a>
      <a href="quote.html" data-page="quote.html">Get a Quote</a>
      <a href="about.html" data-page="about.html">About</a>
      <a href="resources.html" data-page="resources.html">Resources</a>
      <a href="contact.html" data-page="contact.html">Contact</a>
      <span id="nav-auth-slot"></span>
    </div>
  </nav>
</header>

<section class="page-hero">
  <img src="images/truck.png" alt="" class="page-hero-bg-img" onerror="this.style.display='none'">
  <div class="page-hero-glass">
    <h1>Track & Trace</h1>
    <p>Real-time visibility for every shipment.</p>
  </div>
</section>

<main class="form-page" style="padding-top:56px;">
  <form id="track-form" style="display:flex; gap:12px; flex-wrap:wrap;">
    <input type="text" id="tracking-number" placeholder="Enter Tracking Number" required
      style="flex:1; min-width:200px; padding:12px 14px; border:1px solid var(--slate-200); border-radius:8px; font-size:14.5px;">
    <button type="submit" id="track-btn" class="btn btn-primary">Track</button>
  </form>
  <p style="font-size:13px; color:var(--slate-500); margin-top:10px;">
    Try: <strong>PLX-2026-000123</strong> for a demo shipment
  </p>
  <p id="track-msg" class="form-msg error"></p>

  <div id="tracking-result" class="tracking-result" style="display:none;"></div>
</main>

<footer class="site-footer">
  <div class="footer-bottom" style="max-width:1120px; margin:0 auto; border-top:none; padding-top:0;">
    © <span id="year"></span> WUSHMAT FAG LTD. All rights reserved.
  </div>
</footer>

<div class="floating-actions">
  <a href="track.html" class="floating-btn track" title="Track Shipment" aria-label="Track Shipment">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
  </a>
  <a href="quote.html" class="floating-btn quote" title="Get a Quote" aria-label="Get a Quote">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6a1 1 0 0 1 1 1v1h1a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1V4a1 1 0 0 1 1-1z"/><path d="M9 12h6M9 16h4"/></svg>
  </a>
  <a href="https://wa.me/254700000000" class="floating-btn whatsapp" title="Chat on WhatsApp" aria-label="Chat on WhatsApp" target="_blank" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.87.5 3.62 1.44 5.15L2 22l5.13-1.53a9.86 9.86 0 0 0 4.9 1.31h.01c5.46 0 9.9-4.45 9.9-9.9C21.94 6.45 17.5 2 12.04 2zm5.79 14.06c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.13.11-1.83-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.79-4.15-4.94-4.34-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.57.81 1.98.88 2.13.07.14.12.31.02.5-.1.19-.15.3-.29.46-.14.16-.3.36-.43.48-.14.13-.29.28-.13.55.17.28.75 1.24 1.61 2.01 1.11.99 2.04 1.3 2.32 1.44.28.14.44.12.6-.07.17-.19.71-.83.9-1.11.19-.28.38-.24.63-.14.26.09 1.65.78 1.93.92.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
  </a>
</div>


<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script src="js/track.js"></script>
</body>
</html>
